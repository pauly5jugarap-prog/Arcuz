<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Arcuz: Behind the Dark — Offline Mobile</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root { color-scheme: dark; --pad: clamp(8px, 2vw, 22px); --sm: clamp(46px, 14vh, 68px); --lg: clamp(66px, 21vh, 96px); --stick: clamp(110px, 38vh, 170px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090d; }
body { position: fixed; inset: 0; font-family: system-ui, sans-serif; overscroll-behavior: none; -webkit-touch-callout: none; }
#game-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
ruffle-player { display: block; width: 100%; height: 100%; outline: none; }

#overlay { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at center, #202330, #08090d 72%); text-align: center; }
#overlay h1 { margin: 0; color: #f1c40f; font-size: clamp(20px, 5vw, 34px); line-height: 1.2; }
#start-btn { min-height: 56px; padding: 14px 28px; border: 2px solid white; border-radius: 12px; background: #219653; color: white; font-size: 18px; font-weight: 800; touch-action: manipulation; }
#status { max-width: 42rem; color: #e5e7eb; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }

#controls { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#controls[hidden], #overlay[hidden] { display: none !important; }

/* LEFT SIDE: menu buttons on top, joystick at the bottom (both sit in the black side space) */
#menu-bar { position: absolute; top: max(var(--pad), env(safe-area-inset-top)); left: max(var(--pad), env(safe-area-inset-left)); display: grid; grid-template-columns: repeat(2, auto); gap: 6px; pointer-events: none; }
#stick-base { position: absolute; left: max(var(--pad), env(safe-area-inset-left)); bottom: max(var(--pad), env(safe-area-inset-bottom)); width: var(--stick); height: var(--stick); border: 2px solid #ffffff70; border-radius: 50%; background: #ffffff1a; display: grid; place-items: center; pointer-events: auto; touch-action: none; }
#stick-knob { width: 42%; height: 42%; border: 2px solid #fff; border-radius: 50%; background: #ffffff70; pointer-events: none; }

/* RIGHT SIDE: spells, items, attack / jump */
.ui-right { position: absolute; right: max(var(--pad), env(safe-area-inset-right)); bottom: max(var(--pad), env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.row { display: flex; gap: 8px; pointer-events: none; }
#row-spells { display: grid; grid-template-columns: repeat(2, auto); gap: 8px; }

.btn { width: var(--sm); height: var(--sm); border: 2px solid #ffffffd9; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; color: #fff; background: #ffffff30; font: 800 clamp(16px, 4.6vh, 22px) system-ui, sans-serif; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; padding: 0; }
.btn small { font-size: clamp(9px, 2.6vh, 12px); font-weight: 600; opacity: .95; margin-top: 3px; }
.btn.lg { width: var(--lg); height: var(--lg); border-radius: 50%; font-size: clamp(20px, 6vh, 28px); }
.btn.lg small { font-size: clamp(10px, 3vh, 14px); }
.btn.menu { width: auto; min-width: clamp(78px, 11vw, 120px); height: clamp(38px, 11vh, 52px); padding: 0 10px; flex-direction: row; gap: 6px; background: #000000a0; border-radius: 10px; font-size: clamp(15px, 4.4vh, 20px); }
.btn.menu small { font-size: clamp(11px, 3.2vh, 15px); margin: 0; }
.btn.spell { background: #9b59b6a0; }
.btn.item  { background: #27ae60a0; }
.btn[data-k="j"] { background: #e74c3cb0; }
.btn[data-k="k"] { background: #3498dbb0; }
.btn.on { filter: brightness(1.5); transform: scale(.94); }

/* Info (hover) mode */
#hover-layer { position: fixed; inset: 0; z-index: 10; touch-action: none; background: transparent; }
#hover-layer[hidden] { display: none; }

/* Cover-up strips that hide parts of the game's own HUD (see HIDE_ZONES) */
.hide-zone { position: fixed; z-index: 5; pointer-events: none; background: #1a140e; }
body.calibrate .hide-zone { background: rgba(255, 0, 0, .35); outline: 2px solid red; }

/* Ask for landscape on phones */
#rotate { position: fixed; inset: 0; z-index: 3000; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #08090d; color: #f1c40f; text-align: center; padding: 24px; font-size: 18px; font-weight: 700; }
#rotate .ico { font-size: 56px; display: inline-block; animation: tilt 1.6s ease-in-out infinite; }
@keyframes tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>

<script>
// Configure Ruffle before its runtime script loads.
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "off", letterbox: "on", scale: "showAll", forceScale: true,
  quality: "medium", logLevel: "error", unmuteOverlay: "visible"
};
</script>
<script src="./ruffle/ruffle.js" defer onerror="window.ruffleScriptFailed = true"></script>

<script defer>
/* =====================================================================
   BUTTON LAYOUT: edit this section to remap or add buttons.
   k = keyboard key sent to the game, label = text shown on the button.
   ===================================================================== */
const LAYOUT = {
  // Top bar (menus / windows)
  menu: [
    { k: 'v', label: 'Skills' },
    { k: 'b', label: 'Bag'    },
    { k: 'c', label: 'Char'   },
    { k: 'm', label: 'Map'    },
    { k: 'n', label: 'Quest'  }
  ],
  // Bottom-right, top row: spell skills
  spells: [
    { k: 'u', label: 'Spell' },
    { k: 'i', label: 'Spell' },
    { k: 'o', label: 'Spell' },
    { k: 'l', label: 'Spell' }
  ],
  // Bottom-right, middle row: potions / town portal
  items: [
    { k: '1', label: 'Item' },
    { k: '2', label: 'Item' },
    { k: '3', label: 'Item' }
  ],
  // Bottom-right, bottom row: big action buttons
  combat: [
    { k: 'j', label: 'Attack' },
    { k: 'k', label: 'Jump'   }
  ]
};
// Parts of the game's own screen to cover up (its bottom button row: CHAR, SKILL,
// INV, QUESTS, MAP) because we already have touch buttons for them.
// x, y, w, h are fractions (0 to 1) of the game screen itself. The MENU button on
// the right of that row is left uncovered so the player can still open the game menu.
// To check or adjust the position, open the web page with  #calibrate  on the end
// of the link; the strip turns red and see-through.
const HIDE_ZONES = [
  { x: 0.17, y: 0.884, w: 0.567, h: 0.051 }
];
const ZONE_COLOR = '#1a140e';        // colour of the cover strip
const STAGE_ASPECT = 728 / 659;      // game screen width / height (used if Ruffle can't tell)

// Joystick sends these keys:
const STICK = { left: 'a', right: 'd', up: 'w', down: 's' };
/* ===================================================================== */

document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('game-container');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const status = document.getElementById('status');
  const controls = document.getElementById('controls');
  const base = document.getElementById('stick-base');
  const knob = document.getElementById('stick-knob');

  let player = null;
  let loaded = false;
  const held = new Set();
  const pressedAt = new Map();
  const activePointers = new Map();

  // ---- key helpers --------------------------------------------------
  const isDigit = k => /^[0-9]$/.test(k);
  const codeFor = k => isDigit(k) ? k.charCodeAt(0) : k.toUpperCase().charCodeAt(0);
  const evCode  = k => isDigit(k) ? 'Digit' + k : 'Key' + k.toUpperCase();

  const allKeys = new Set(Object.values(STICK));
  Object.values(LAYOUT).forEach(list => list.forEach(b => allKeys.add(b.k)));

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline caching unavailable:', err));
  }

  function showError(message) {
    status.textContent = message;
    status.style.color = '#ffb4ab';
    startBtn.disabled = false;
    startBtn.textContent = 'RETRY';
  }

  function keyEvent(key, type) {
    if (!player || !allKeys.has(key)) return;
    player.dispatchEvent(new KeyboardEvent(type, {
      key, code: evCode(key), bubbles: true, cancelable: true,
      keyCode: codeFor(key), which: codeFor(key)
    }));
  }
  function press(key) {
    if (held.has(key)) return;
    held.add(key); pressedAt.set(key, performance.now());
    keyEvent(key, 'keydown');
  }
  function release(key) {
    if (!held.has(key)) return;
    // Hold every key at least ~60 ms so quick taps (menus, potions) register.
    const wait = Math.max(0, 60 - (performance.now() - (pressedAt.get(key) || 0)));
    const doRelease = () => { if (!held.has(key)) return; held.delete(key); keyEvent(key, 'keyup'); };
    wait ? setTimeout(doRelease, wait) : doRelease();
  }
  function releaseAll() {
    [...held].forEach(release);
    activePointers.clear();
    document.querySelectorAll('.btn.on').forEach(b => b.classList.remove('on'));
    knob.style.transform = 'translate(0,0)';
  }

  // ---- build buttons from LAYOUT ------------------------------------
  function makeBtn(def, extraClass) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + (extraClass || '');
    b.dataset.k = def.k;
    b.innerHTML = '<span>' + def.k.toUpperCase() + '</span><small>' + def.label + '</small>';
    return b;
  }
  function fill(id, list, cls) {
    const el = document.getElementById(id);
    list.forEach(def => el.appendChild(makeBtn(def, cls)));
  }
  fill('menu-bar', LAYOUT.menu, 'menu');
  fill('row-spells', LAYOUT.spells, 'spell');
  fill('row-items', LAYOUT.items, 'item');
  fill('row-combat', LAYOUT.combat, 'lg');


  // ---- TOUCH = MOUSE ------------------------------------------------
  // A touch screen has no "hover", but the game shows item descriptions on hover.
  // This layer turns finger gestures into mouse actions for the game:
  //   quick tap          -> normal click
  //   hold / drag finger -> hover only (item description shows, nothing is clicked)
  const hoverLayer = document.getElementById('hover-layer');
  const TAP_MS = 300, TAP_MOVE_PX = 12;

  function hoverTarget() {
    return (player && player.shadowRoot && player.shadowRoot.querySelector('canvas')) || player;
  }
  function baseInit(x, y, buttons) {
    return { clientX: x, clientY: y, screenX: x, screenY: y, bubbles: true, cancelable: true, composed: true, view: window, buttons: buttons, button: 0 };
  }
  const ptr = { pointerId: 1, pointerType: 'mouse', isPrimary: true };
  function sendHover(x, y) {
    const t = hoverTarget(); if (!t) return;
    const init = baseInit(x, y, 0);
    t.dispatchEvent(new PointerEvent('pointermove', Object.assign({}, ptr, init)));
    t.dispatchEvent(new MouseEvent('mousemove', init));
  }
  function sendEnter(x, y) {
    const t = hoverTarget(); if (!t) return;
    const init = baseInit(x, y, 0);
    ['pointerover', 'pointerenter'].forEach(n => t.dispatchEvent(new PointerEvent(n, Object.assign({}, ptr, init))));
    ['mouseover', 'mouseenter'].forEach(n => t.dispatchEvent(new MouseEvent(n, init)));
  }
  function sendButton(down, x, y) {
    const t = hoverTarget(); if (!t) return;
    const init = baseInit(x, y, down ? 1 : 0);
    t.dispatchEvent(new PointerEvent(down ? 'pointerdown' : 'pointerup', Object.assign({ detail: 1 }, ptr, init)));
    t.dispatchEvent(new MouseEvent(down ? 'mousedown' : 'mouseup', Object.assign({ detail: 1 }, init)));
  }

  let glideTimers = [];
  function clearGlide() { glideTimers.forEach(clearTimeout); glideTimers = []; }
  function glideTo(x, y) {
    clearGlide();
    sendEnter(x - 40, y - 28);
    // Slow, human-like approach ending on the finger so tooltips trigger.
    const path = [[-36, -25], [-28, -19], [-20, -13], [-13, -8], [-7, -4], [-3, -2], [-1, -1], [1, 0], [0, 0]];
    path.forEach(([dx, dy], i) => {
      glideTimers.push(setTimeout(() => sendHover(x + dx, y + dy), 20 + i * 45));
    });
  }

  // ---- cover-up strips over the game's own bottom buttons ------------
  if (location.hash === '#calibrate') document.body.classList.add('calibrate');
  let zoneEls = [];
  let zoneRects = [];
  function stageRect() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let a = STAGE_ASPECT;
    const m = player && player.metadata;
    if (m && m.width && m.height) a = m.width / m.height;
    let w, hh;
    if (vw / vh > a) { hh = vh; w = vh * a; } else { w = vw; hh = vw / a; }
    return { x: (vw - w) / 2, y: (vh - hh) / 2, w: w, h: hh };
  }
  function layoutZones() {
    const s = stageRect();
    zoneRects = HIDE_ZONES.map(z => ({ x: s.x + z.x * s.w, y: s.y + z.y * s.h, w: z.w * s.w, h: z.h * s.h }));
    while (zoneEls.length < zoneRects.length) {
      const d = document.createElement('div');
      d.className = 'hide-zone';
      d.style.background = ZONE_COLOR;
      document.body.appendChild(d);
      zoneEls.push(d);
    }
    zoneRects.forEach((r, i) => {
      const d = zoneEls[i];
      d.style.left = r.x + 'px'; d.style.top = r.y + 'px';
      d.style.width = r.w + 'px'; d.style.height = r.h + 'px';
    });
  }
  function inZone(x, y) {
    return zoneRects.some(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
  }
  ['resize', 'orientationchange', 'fullscreenchange'].forEach(ev => window.addEventListener(ev, () => setTimeout(layoutZones, 150)));

  let gesture = null;
  hoverLayer.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (inZone(e.clientX, e.clientY)) return;
    if (e.pointerType === 'mouse') { sendHover(e.clientX, e.clientY); sendButton(true, e.clientX, e.clientY); return; }
    if (gesture) return; // ignore a second finger
    try { hoverLayer.setPointerCapture(e.pointerId); } catch (_) {}
    gesture = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
    glideTo(e.clientX, e.clientY);
  });
  hoverLayer.addEventListener('pointermove', e => {
    e.preventDefault();
    if (e.pointerType === 'mouse') { sendHover(e.clientX, e.clientY); return; }
    if (!gesture || e.pointerId !== gesture.id) return;
    if (!gesture.moved && Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y) > TAP_MOVE_PX) {
      gesture.moved = true; clearGlide();
    }
    if (gesture.moved) sendHover(e.clientX, e.clientY);
  });
  hoverLayer.addEventListener('pointerup', e => {
    e.preventDefault();
    if (e.pointerType === 'mouse') { if (!inZone(e.clientX, e.clientY)) sendButton(false, e.clientX, e.clientY); return; }
    if (!gesture || e.pointerId !== gesture.id) return;
    const g = gesture; gesture = null;
    clearGlide();
    if (!g.moved && performance.now() - g.t < TAP_MS) {
      // Quick tap: hover the spot, then click it.
      sendHover(g.x, g.y);
      setTimeout(() => sendButton(true, g.x, g.y), 30);
      setTimeout(() => sendButton(false, g.x, g.y), 100);
    }
    // Otherwise it was a hold/drag: leave the pointer resting there so the description stays.
  });
  hoverLayer.addEventListener('pointercancel', () => { gesture = null; clearGlide(); });
  hoverLayer.addEventListener('contextmenu', e => e.preventDefault());


  // ---- load game ----------------------------------------------------
  const isAndroid = /Android/i.test(navigator.userAgent);
  function goFullscreenLandscape() {
    // Must run directly inside the tap, before any await, or the browser refuses.
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    Promise.resolve(req.call(el, { navigationUI: 'hide' }))
      .then(() => {
        if (screen.orientation && screen.orientation.lock) {
          return screen.orientation.lock('landscape').catch(() => {});
        }
      })
      .catch(() => {});
  }

  startBtn.addEventListener('click', async () => {
    goFullscreenLandscape();
    startBtn.disabled = true;
    status.style.color = '#e5e7eb';
    status.textContent = 'Loading Arcuz…';
    try {
      if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
        throw new Error(window.ruffleScriptFailed ? 'Offline Ruffle runtime not found. Add the official Ruffle web package files to the ./ruffle/ folder, including ruffle.js and its WASM file.' : 'Ruffle is not ready yet. Please retry in a moment.');
      }
      if (!player) {
        player = window.RufflePlayer.newest().createPlayer();
        player.setAttribute('aria-label', 'Arcuz Flash game');
        player.tabIndex = 0;
        player.style.width = '100%';
        player.style.height = '100%';
        player.config = window.RufflePlayer.config;
        container.appendChild(player);
      }
      if (!loaded) {
        await player.load({ url: new URL('./Arcuz.swf', document.baseURI).href });
        loaded = true;
      }
      try { await player.play(); } catch (_) {}
      overlay.hidden = true;
      controls.hidden = false;
      hoverLayer.hidden = false;
      layoutZones();
      setTimeout(layoutZones, 600);
      setTimeout(layoutZones, 2000);
      player.focus();
      status.textContent = '';
      if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    } catch (err) {
      console.error('Arcuz load error:', err);
      showError('Could not load Arcuz.swf. Make sure Arcuz.swf is beside index.html and the local Ruffle runtime is in ./ruffle/. Details: ' + (err && err.message ? err.message : String(err)));
    }
  });

  // Re-acquire wake lock when returning to the tab
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAll();
    else if (!controls.hidden && navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
  });

  // ---- touch buttons ------------------------------------------------
  document.querySelectorAll('.btn[data-k]').forEach(btn => {
    const key = btn.dataset.k;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      activePointers.set(e.pointerId, key);
      press(key);
      btn.classList.add('on');
      if (navigator.vibrate) navigator.vibrate(8);
    });
    const finish = e => {
      if (activePointers.has(e.pointerId)) {
        const k = activePointers.get(e.pointerId);
        activePointers.delete(e.pointerId);
        release(k);
      }
      btn.classList.remove('on');
    };
    btn.addEventListener('pointerup', finish);
    btn.addEventListener('pointercancel', finish);
    btn.addEventListener('lostpointercapture', finish);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // ---- joystick -----------------------------------------------------
  let stickPointer = null;
  function moveStick(e) {
    const rect = base.getBoundingClientRect();
    let dx = e.clientX - (rect.left + rect.width / 2);
    let dy = e.clientY - (rect.top + rect.height / 2);
    const max = rect.width * 0.33;
    const dist = Math.hypot(dx, dy);
    if (dist > max) { dx *= max / dist; dy *= max / dist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const dead = 12;
    [[STICK.left, dx < -dead], [STICK.right, dx > dead], [STICK.up, dy < -dead], [STICK.down, dy > dead]]
      .forEach(([k, down]) => down ? press(k) : release(k));
  }
  base.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (stickPointer !== null) return;
    stickPointer = e.pointerId;
    try { base.setPointerCapture(e.pointerId); } catch (_) {}
    moveStick(e);
  });
  base.addEventListener('pointermove', e => { if (e.pointerId === stickPointer) { e.preventDefault(); moveStick(e); } });
  function endStick(e) {
    if (e.pointerId !== stickPointer) return;
    stickPointer = null;
    Object.values(STICK).forEach(release);
    knob.style.transform = 'translate(0,0)';
  }
  base.addEventListener('pointerup', endStick);
  base.addEventListener('pointercancel', endStick);
  base.addEventListener('lostpointercapture', endStick);

  // ---- physical keyboard (desktop testing) --------------------------
  window.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : '';
    if (allKeys.has(k)) { e.preventDefault(); press(k); }
  });
  window.addEventListener('keyup', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : '';
    if (allKeys.has(k)) { e.preventDefault(); release(k); }
  });
  window.addEventListener('blur', releaseAll);
  window.addEventListener('contextmenu', e => e.preventDefault());
});
</script>
</head>
<body>
<main id="game-container" aria-label="Arcuz game area"></main>

<section id="overlay">
  <h1>ARCUZ: BEHIND THE DARK</h1>
  <button id="start-btn" type="button">TAP TO PLAY</button>
  <p id="status" role="status" aria-live="polite">Offline-ready build: first open it online once, then revisit while online so the browser can cache the files for offline use.</p>
</section>

<div id="hover-layer" hidden></div>

<div id="rotate"><span class="ico">📱</span>Please rotate your phone to landscape</div>

<div id="controls" hidden>
  <div id="menu-bar"></div>
  <div id="stick-base" aria-label="Movement joystick"><div id="stick-knob"></div></div>
  <div class="ui-right">
    <div class="row" id="row-spells"></div>
    <div class="row" id="row-items"></div>
    <div class="row" id="row-combat"></div>
  </div>
</div>
</body>
</html>
