<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>Arcuz: Behind the Dark — Offline Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root { color-scheme: dark; --pad: clamp(12px, 3vw, 28px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090d; }
    body { position: fixed; inset: 0; font-family: system-ui, sans-serif; overscroll-behavior: none; }
    #game-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    ruffle-player { display: block; width: 100%; height: 100%; outline: none; }
    #overlay { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at center, #202330, #08090d 72%); text-align: center; }
    #overlay h1 { margin: 0; color: #f1c40f; font-size: clamp(20px, 5vw, 34px); line-height: 1.2; }
    #start-btn { min-height: 56px; padding: 14px 28px; border: 2px solid white; border-radius: 12px; background: #219653; color: white; font-size: 18px; font-weight: 800; touch-action: manipulation; }
    #status { max-width: 42rem; color: #e5e7eb; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
    #controls { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    #stick-base { position: absolute; left: max(var(--pad), env(safe-area-inset-left)); bottom: max(var(--pad), env(safe-area-inset-bottom)); width: clamp(94px, 24vw, 124px); height: clamp(94px, 24vw, 124px); border: 2px solid #ffffff70; border-radius: 50%; background: #ffffff1a; display: grid; place-items: center; pointer-events: auto; touch-action: none; }
    #stick-knob { width: 42%; height: 42%; border: 2px solid #fff; border-radius: 50%; background: #ffffff70; pointer-events: none; }
    .ui-right { position: absolute; right: max(var(--pad), env(safe-area-inset-right)); bottom: max(var(--pad), env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
    .row { display: flex; gap: 8px; pointer-events: none; }
    .btn { width: clamp(42px, 12vw, 54px); height: clamp(42px, 12vw, 54px); border: 2px solid #ffffffd9; border-radius: 10px; display: grid; place-items: center; color: #fff; background: #ffffff35; font: 800 16px system-ui, sans-serif; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
    .combat-btn { width: clamp(58px, 16vw, 76px); height: clamp(58px, 16vw, 76px); border-radius: 50%; font-size: 18px; }
    .btn[data-k="j"] { background: #e74c3c99; } .btn[data-k="k"] { background: #3498db99; }
    #controls[hidden], #overlay[hidden] { display: none !important; }
    @media (orientation: portrait) { #overlay h1 { max-width: 16ch; } }
  </style>
  <script>
    // Configure Ruffle before its runtime script loads.
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "off",
      letterbox: "on",
      scale: "showAll",
      forceScale: true,
      quality: "medium",
      logLevel: "error",
      unmuteOverlay: "visible"
    };
  </script>
  <script src="./ruffle/ruffle.js" defer onerror="window.ruffleScriptFailed = true"></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('game-container');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start-btn');
      const status = document.getElementById('status');
      const controls = document.getElementById('controls');
      const base = document.getElementById('stick-base');
      const knob = document.getElementById('stick-knob');
      let player = null;
      let loaded = false;
      const held = new Set();
      const keyCodes = { w:87, a:65, s:83, d:68, j:74, k:75, i:73, l:76, '1':49, '2':50, '3':51 };

      // Offline cache is enabled only when served from HTTPS or localhost.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline caching unavailable:', err));
      }

      function showError(message) {
        status.textContent = message;
        status.style.color = '#ffb4ab';
        startBtn.disabled = false;
        startBtn.textContent = 'RETRY';
      }
      function keyEvent(key, type) {
        if (!player || !keyCodes[key]) return;
        const code = key.length === 1 && key >= '1' && key <= '3' ? 'Digit' + key : 'Key' + key.toUpperCase();
        player.dispatchEvent(new KeyboardEvent(type, {
          key, code, bubbles: true, cancelable: true,
          keyCode: keyCodes[key], which: keyCodes[key]
        }));
      }
      function press(key) {
        if (held.has(key)) return;
        held.add(key); keyEvent(key, 'keydown');
      }
      function release(key) {
        if (!held.has(key)) return;
        held.delete(key); keyEvent(key, 'keyup');
      }
      function releaseAll() {
        [...held].forEach(release);
        activePointers.clear();
        knob.style.transform = 'translate(0,0)';
      }

      // Use the original SWF unchanged. Load errors stay visible instead of hiding behind the splash screen.
      startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        status.style.color = '#e5e7eb';
        status.textContent = 'Loading Arcuz…';
        try {
          if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
            throw new Error(window.ruffleScriptFailed ? 'Offline Ruffle runtime not found. Add the official Ruffle web package files to the ./ruffle/ folder, including ruffle.js and its WASM file.' : 'Ruffle is not ready yet. Please retry in a moment.');
          }
          if (!player) {
            player = window.RufflePlayer.newest().createPlayer();
            player.setAttribute('aria-label', 'Arcuz Flash game');
            player.tabIndex = 0;
            player.style.width = '100%';
            player.style.height = '100%';
            player.config = window.RufflePlayer.config;
            container.appendChild(player);
          }
          if (!loaded) {
            await player.load({ url: new URL('./Arcuz.swf', document.baseURI).href });
            loaded = true;
          }
          try { await player.play(); } catch (_) { /* Some SWFs begin playing automatically after load. */ }
          overlay.hidden = true;
          controls.hidden = false;
          player.focus();
          status.textContent = '';
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } catch (err) {
          console.error('Arcuz load error:', err);
          showError('Could not load Arcuz.swf. Make sure Arcuz.swf is beside index.html and the local Ruffle runtime is in ./ruffle/. Details: ' + (err && err.message ? err.message : String(err)));
        }
      });

      // Virtual buttons use Pointer Events, including pointercancel, for reliable touch release.
      const activePointers = new Map();
      document.querySelectorAll('.btn').forEach(btn => {
        const key = btn.dataset.k;
        btn.addEventListener('pointerdown', e => {
          e.preventDefault();
          try { btn.setPointerCapture(e.pointerId); } catch (_) {}
          activePointers.set(e.pointerId, key);
          press(key);
          btn.style.filter = 'brightness(1.35)';
        });
        const finish = e => {
          if (activePointers.has(e.pointerId)) {
            const k = activePointers.get(e.pointerId);
            activePointers.delete(e.pointerId);
            release(k);
          }
          btn.style.filter = '';
        };
        btn.addEventListener('pointerup', finish);
        btn.addEventListener('pointercancel', finish);
        btn.addEventListener('lostpointercapture', finish);
        btn.addEventListener('contextmenu', e => e.preventDefault());
      });

      let stickPointer = null;
      function moveStick(e) {
        const rect = base.getBoundingClientRect();
        let dx = e.clientX - (rect.left + rect.width / 2);
        let dy = e.clientY - (rect.top + rect.height / 2);
        const max = rect.width * 0.33;
        const dist = Math.hypot(dx, dy);
        if (dist > max) { dx *= max / dist; dy *= max / dist; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        const dead = 12;
        [['a', dx < -dead], ['d', dx > dead], ['w', dy < -dead], ['s', dy > dead]].forEach(([k, down]) => down ? press(k) : release(k));
      }
      base.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (stickPointer !== null) return;
        stickPointer = e.pointerId;
        try { base.setPointerCapture(e.pointerId); } catch (_) {}
        moveStick(e);
      });
      base.addEventListener('pointermove', e => { if (e.pointerId === stickPointer) { e.preventDefault(); moveStick(e); } });
      function endStick(e) {
        if (e.pointerId !== stickPointer) return;
        stickPointer = null;
        ['w','a','s','d'].forEach(release);
        knob.style.transform = 'translate(0,0)';
      }
      base.addEventListener('pointerup', endStick);
      base.addEventListener('pointercancel', endStick);
      base.addEventListener('lostpointercapture', endStick);

      // Physical keyboard support for desktop testing and emergency key release when tab loses focus.
      window.addEventListener('keydown', e => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : '';
        if (keyCodes[k]) { e.preventDefault(); press(k); }
      });
      window.addEventListener('keyup', e => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : '';
        if (keyCodes[k]) { e.preventDefault(); release(k); }
      });
      window.addEventListener('blur', releaseAll);
      document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
      window.addEventListener('contextmenu', e => e.preventDefault());
    });
  </script>
</head>
<body>
  <main id="game-container" aria-label="Arcuz game area"></main>
  <section id="overlay">
    <h1>ARCUZ: BEHIND THE DARK</h1>
    <button id="start-btn" type="button">TAP TO PLAY</button>
    <p id="status" role="status" aria-live="polite">Offline-ready build: first open it online once, after adding Arcuz.swf and the local Ruffle runtime. Then revisit while online so the browser can cache the files for offline use.</p>
  </section>
  <div id="controls" hidden>
    <div id="stick-base" aria-label="Movement joystick"><div id="stick-knob"></div></div>
    <div class="ui-right">
      <div class="row"><button class="btn" type="button" data-k="i">I</button><button class="btn" type="button" data-k="l">L</button></div>
      <div class="row"><button class="btn" type="button" data-k="1">1</button><button class="btn" type="button" data-k="2">2</button><button class="btn" type="button" data-k="3">3</button></div>
      <div class="row"><button class="btn combat-btn" type="button" data-k="j">J</button><button class="btn combat-btn" type="button" data-k="k">K</button></div>
    </div>
  </div>
</body>
</html>
